name: CI

# Unit tests + production build on every pull request and on main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:run
      - name: Build
        run: npm run build
        env:
          # Don't rewrite package.json during CI builds.
          NO_VERSION_BUMP: '1'
