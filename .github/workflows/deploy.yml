name: Deploy

# Automatic deployment over SSH (Docker target).
# Triggers on every push to main, and can also be run manually.
#
# Skips cleanly (job stays green) until the required secrets/variables are
# configured, so it doesn't produce noisy failures before setup. Required:
#   secrets:   SSH_PRIVATE_KEY, SSH_HOST, SSH_USER, SSH_PORT
#   variables: REMOTE_DIR, REPO_URL, HOST_PORT
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: false
        default: "main"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    environment: production
    # Map the gating secret to an env var so steps can guard on it.
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "${SSH_HOST}" ]; then
            echo "::notice::SSH_HOST secret not set — skipping deploy. Configure deploy secrets to enable."
          fi

      - name: Checkout
        if: env.SSH_HOST != ''
        uses: actions/checkout@v4

      - name: Configure SSH key
        if: env.SSH_HOST != ''
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: Run remote deployment
        if: env.SSH_HOST != ''
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "REMOTE_DIR='${REMOTE_DIR}' REPO_URL='${REPO_URL}' DEPLOY_BRANCH='${DEPLOY_BRANCH}' HOST_PORT='${HOST_PORT}' MODE='deploy' bash -s" \
            < deploy/server-deploy.sh
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_DIR: ${{ vars.REMOTE_DIR }}
          REPO_URL: ${{ vars.REPO_URL }}
          DEPLOY_BRANCH: ${{ github.event.inputs.branch || 'main' }}
          HOST_PORT: ${{ vars.HOST_PORT }}
